[project]
name = "logprob-gap"
version = "0.1.0"
description = "How far an RL sampler's token logprobs drift from the trainer's, measured on a small model"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "matplotlib>=3.11.2",
    "mlx>=0.32.4",
    "mlx-lm>=0.32.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
